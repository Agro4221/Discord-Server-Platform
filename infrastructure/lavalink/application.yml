server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

# Plugin-owned configuration.
# Sources stay disabled by default; enable them in .env only after credentials
# for that provider are configured.
plugins:
  lavalyrics:
    sources:
      - spotify
      - youtube
      - deezer
      - yandexMusic
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: ${LAVASRC_SPOTIFY_ENABLED:false}
      applemusic: ${LAVASRC_APPLEMUSIC_ENABLED:false}
      deezer: ${LAVASRC_DEEZER_ENABLED:false}
      yandexmusic: ${LAVASRC_YANDEXMUSIC_ENABLED:false}
      vkmusic: ${LAVASRC_VKMUSIC_ENABLED:false}
      tidal: ${LAVASRC_TIDAL_ENABLED:false}
      qobuz: ${LAVASRC_QOBUZ_ENABLED:false}
      ytdlp: ${LAVASRC_YTDLP_ENABLED:false}
      jiosaavn: ${LAVASRC_JIOSAAVN_ENABLED:false}
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: ${LAVASRC_COUNTRY_CODE:DE}
      playlistLoadLimit: 6
      albumLoadLimit: 6
    applemusic:
      mediaAPIToken: "${APPLE_MUSIC_API_TOKEN:}"
      countryCode: ${LAVASRC_COUNTRY_CODE:DE}
      playlistLoadLimit: 6
      albumLoadLimit: 6
    deezer:
      masterDecryptionKey: "${DEEZER_MASTER_DECRYPTION_KEY:}"
      arl: "${DEEZER_ARL:}"
    yandexmusic:
      accessToken: "${YANDEX_MUSIC_ACCESS_TOKEN:}"
    vkmusic:
      userToken: "${VK_MUSIC_USER_TOKEN:}"
    tidal:
      token: "${TIDAL_TOKEN:}"
    qobuz:
      userOauthToken: "${QOBUZ_USER_OAUTH_TOKEN:}"
    ytdlp:
      path: "${YTDLP_PATH:yt-dlp}"
    jiosaavn:
      decryption:
        secretKey: "${JIOSAAVN_SECRET_KEY:}"

lavalink:
  server:
    password: "${LAVALINK_SERVER_PASSWORD:change-me-local}"
    sources:
      soundcloud: true
      twitch: true
      vimeo: true
      bandcamp: true
      http: true
    resumingEnabled: true
    resumeTimeout: 300
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0"
      snapshot: false

logging:
  level:
    root: INFO
